<!doctype html>
<html lang="de">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#06131b"/><meta name="robots" content="noindex,nofollow"/><title>Ocean Trader · 3D Harbour</title></head>
<body><div class="p5-shell">
<header class="p5-top"><div class="p5-title"><small>MARITIME SIMULATOR</small><strong>Rotterdam Training Basin</strong></div><div class="camera-switch"><button class="active" data-camera="chase">CHASE</button><button data-camera="bridge">BRIDGE</button><button data-camera="tactical">TACTICAL</button></div></header>
<main class="scene-wrap"><canvas id="p5-canvas"></canvas><div class="hud"><div><span>HDG</span><strong data-hdg>000°</strong></div><div><span>SOG</span><strong data-sog>0.0 kn</strong></div><div><span>ROT</span><strong data-rot>0.0°/min</strong></div><div><span>RUDDER</span><strong data-rudder>0°</strong></div><div><span>ENGINE</span><strong data-engine>STOP</strong></div><div><span>DRAFT</span><strong data-draft>0.0 m</strong></div><div><span>HULL</span><strong data-condition>100%</strong></div></div><div class="operation-status" data-status>Approach berth</div></main>
<section class="p5-controls" aria-label="Schiffssteuerung"><div class="engine-orders"><button data-engine-order="FULL ASTERN">FULL<br>ASTERN</button><button data-engine-order="HALF ASTERN">HALF<br>ASTERN</button><button data-engine-order="SLOW ASTERN">SLOW<br>ASTERN</button><button class="active" data-engine-order="STOP">STOP</button><button data-engine-order="SLOW AHEAD">SLOW<br>AHEAD</button><button data-engine-order="HALF AHEAD">HALF<br>AHEAD</button><button data-engine-order="FULL AHEAD">FULL<br>AHEAD</button></div><label class="helm"><span>PORT</span><input id="rudder" type="range" min="-1" max="1" value="0" step="0.05" aria-label="Ruderwinkel"/><span>STBD</span></label><div class="control-footer"><small>60 % Handysize · deterministic 3-DOF @ 30 Hz</small><button class="reset" data-reset>RESET</button></div></section>
</div><script type="module" src="/src/simulator3d/p5.ts"></script></body></html>

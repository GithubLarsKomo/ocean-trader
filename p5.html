<!doctype html>
<html lang="de">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#06131b"/><meta name="robots" content="noindex,nofollow"/><title>Ocean Trader · 3D Harbour</title><link rel="stylesheet" href="/src/simulator3d/p5-environment.css"/></head>
<body><div class="p5-shell">
<header class="p5-top"><div class="p5-title"><small>MARITIME SIMULATOR</small><strong data-scenario-title>Rotterdam · Alongside Berthing</strong></div><div class="top-actions"><label class="scenario-picker" data-scenario-picker><span>TRAINING</span><select data-scenario-select aria-label="Training manoeuvre"><option value="alongside">Alongside</option><option value="unberthing">Unberth</option><option value="turning">Turn 180°</option></select></label><button data-sound>SOUND OFF</button><div class="camera-switch"><button class="active" data-camera="chase">CHASE</button><button data-camera="bridge">BRIDGE</button><button data-camera="tactical">TACTICAL</button></div></div></header>
<main class="scene-wrap"><canvas id="p5-canvas"></canvas><div class="hud"><div><span>HDG</span><strong data-hdg>000°</strong></div><div><span>COG</span><strong data-cog>000°</strong></div><div><span>STW</span><strong data-stw>0.0</strong></div><div><span>SOG</span><strong data-sog>0.0</strong></div><div class="secondary-instrument"><span>ROT</span><strong data-rot>0.0</strong></div><div><span>RUD</span><strong data-rudder>MID</strong></div><div><span>ENG</span><strong data-engine>STOP</strong></div><div><span>BOW</span><strong data-bow-thruster-state>OFF</strong></div><div class="secondary-instrument"><span>DRFT</span><strong data-draft>0.0</strong></div><div class="secondary-instrument"><span>HULL</span><strong data-condition>100%</strong></div></div><div class="operation-status" data-status>Begin manoeuvre</div></main>
<section class="p5-controls" aria-label="Schiffssteuerung"><div class="engine-orders"><button data-engine-order="FULL ASTERN">FULL<br>ASTERN</button><button class="precision-order" data-engine-order="HALF ASTERN">HALF<br>ASTERN</button><button data-engine-order="SLOW ASTERN">SLOW<br>ASTERN</button><button class="active" data-engine-order="STOP">STOP</button><button data-engine-order="SLOW AHEAD">SLOW<br>AHEAD</button><button class="precision-order" data-engine-order="HALF AHEAD">HALF<br>AHEAD</button><button data-engine-order="FULL AHEAD">FULL<br>AHEAD</button></div><div class="manoeuvre-controls"><div class="thruster-control"><span>BOW THRUSTER · HOLD</span><div><button data-bow-thruster="-1">← PORT</button><button data-bow-thruster="1">STBD →</button></div></div><div class="helm-row"><label class="helm"><span>PORT</span><input id="rudder" type="range" min="-1" max="1" value="0" step="0.05" aria-label="Ruderwinkel"/><span>STBD</span></label><div class="rudder-indicator" aria-hidden="true"><span>RUDDER</span><div><i data-rudder-visual></i></div></div></div></div><div class="control-footer"><small data-context>Training · 60% Handysize</small><div><button class="reset" data-return-campaign hidden>RETURN</button><button class="reset" data-reset>RESET</button></div></div></section>
</div><script type="module" src="/src/simulator3d/p5.ts"></script></body></html>
